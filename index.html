<!DOCTYPE html>
<html lang="km" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CYCLO Café - Delivery Hub & Branch Finder</title>
  <link rel="icon" type="image/jpeg" href="assets/image/logo/CycloCafeLogo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@200;300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Kantumruy Pro"', 'sans-serif'],
            mono: ['Roboto', 'monospace'],
          },
          colors: {
            cyclo: {
              black: '#18181B',
              charcoal: '#27272A',
              muted: '#71717A',
              border: '#E4E4E7',
              surface: '#FAFAFA',
              tg: '#229ED9'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Kantumruy Pro', sans-serif;
      font-weight: 300;
      letter-spacing: -0.01em;
      color: #27272A;
      background-color: #FFFFFF;
    }
    .num { 
      font-family: 'Roboto', sans-serif; 
      font-weight: 400;
    }
    .pure-glass {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-white text-zinc-800 min-h-screen flex flex-col antialiased selection:bg-zinc-900 selection:text-white">

  <!-- Minimalist Brand Header -->
  <header class="sticky top-0 z-40 pure-glass border-b border-zinc-200/70 transition-all">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="#" class="flex items-center group">
          <img
            src="assets/image/logo/CycloCafeLogo-wordmark.png"
            alt="CYCLO Café"
            class="h-7 sm:h-8 w-auto object-contain transition-transform group-hover:scale-[1.02]"
          />
        </a>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden md:flex items-center gap-1.5 text-[11px] font-light text-zinc-600 bg-zinc-100/70 px-3 py-1 rounded-full border border-zinc-200/60">
          <i data-lucide="store" class="w-3.5 h-3.5 text-zinc-500"></i>
          <span>សាខាសរុប <span id="headerBranchCount" class="num font-semibold text-zinc-900">0</span></span>
        </div>
        <div class="flex items-center gap-1.5 text-[11px] font-light text-zinc-600 bg-zinc-100/70 px-3 py-1 rounded-full border border-zinc-200/60">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>សេវាដឹកជូន <span class="num text-[11px]">6:30 AM - 6:00 PM</span></span>
        </div>
        <div class="h-3 w-px bg-zinc-200 hidden sm:block"></div>
        <a href="tel:0967397753" class="text-xs font-normal text-zinc-700 hover:text-zinc-950 transition flex items-center gap-1.5 px-2.5 py-1 rounded-lg hover:bg-zinc-100/80">
          <i data-lucide="phone" class="w-3.5 h-3.5 stroke-[1.5] text-zinc-700"></i>
          <span class="num text-[11px] font-medium tracking-tight">096 739 7753</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Promotions Banner Section (Monochrome Tag) -->
  <section id="promoSection" class="hidden max-w-5xl mx-auto w-full px-4 sm:px-6 pt-5 pb-1">
    <div class="bg-zinc-50/80 rounded-2xl p-4 border border-zinc-200/80">
      <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-zinc-900"></span>
          <h2 class="text-xs font-medium text-zinc-900 tracking-tight">ប្រូម៉ូសិនពិសេសប្រចាំថ្ងៃ</h2>
        </div>
        <span class="text-[10px] font-mono font-medium text-zinc-400 uppercase tracking-widest">DAILY DEALS</span>
      </div>

      <div id="promoContainer" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1"></div>
    </div>
  </section>

  <!-- Filter & Search Controls -->
  <section class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-2 sticky top-14 z-30">
    <div class="pure-glass rounded-2xl p-2.5 border border-zinc-200/80 shadow-[0_4px_20px_rgba(0,0,0,0.03)] flex flex-col sm:flex-row gap-2.5 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 stroke-[1.5] absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input
          type="text"
          id="searchBox"
          oninput="handleSearch()"
          placeholder="ស្វែងរកតាមតំបន់ ឬសាខា..."
          class="w-full pl-9 pr-3 py-2 bg-zinc-50/80 border border-zinc-200 rounded-xl text-xs text-zinc-800 placeholder:text-zinc-400 font-light focus:outline-none focus:bg-white focus:border-zinc-900 transition"
        />
      </div>

      <div class="flex items-center gap-1.5 w-full sm:w-auto text-xs bg-zinc-100/70 p-1 rounded-xl border border-zinc-200/60">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-[11px] font-medium bg-zinc-900 text-white shadow-xs transition flex items-center justify-center gap-1">
          <span>ទាំងអស់</span>
          <span id="filterAllCount" class="num text-[10px] opacity-80 font-normal"></span>
        </button>
        <button onclick="setFilter('open')" id="filter-open" class="filter-btn flex-1 sm:flex-none px-3.5 py-1.5 rounded-lg text-[11px] font-light text-zinc-600 hover:text-zinc-900 hover:bg-white/80 transition flex items-center justify-center gap-1">
          <span>បើកលក់</span>
          <span id="filterOpenCount" class="num text-[10px] opacity-80 font-normal"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- Main Grid Content -->
  <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-3 flex-1">
    <!-- Location Meta & Nearby Action Bar -->
    <div class="mb-3.5 flex flex-wrap items-center justify-between gap-2.5 bg-zinc-50/70 p-2 sm:p-2.5 rounded-2xl border border-zinc-200/80 shadow-[0_1px_4px_rgba(0,0,0,0.02)]">
      <!-- Left: Total Location Count & Nearby Status -->
      <div class="flex items-center gap-2 flex-wrap">
        <div class="flex items-center gap-1.5 text-xs font-medium text-zinc-800">
          <i data-lucide="store" class="w-3.5 h-3.5 text-zinc-600"></i>
          <span>សាខាទាំងអស់:</span>
        </div>
        <span id="branchCountBadge" class="text-[11px] font-light text-zinc-600 bg-white px-2.5 py-0.5 rounded-full border border-zinc-200/80 shadow-2xs">
          <span id="visibleBranchCount" class="num font-semibold text-zinc-900">0</span> សាខា
        </span>
        <span id="nearbyStatusIndicator" class="hidden text-[10px] font-medium text-emerald-700 bg-emerald-50/90 px-2.5 py-0.5 rounded-full border border-emerald-200/70 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>តម្រៀបតាមជិតបំផុត</span>
        </span>
      </div>

      <!-- Right: Find Nearby Button & Reset -->
      <div class="flex items-center gap-1.5">
        <button
          id="btnFindNearby"
          onclick="handleNearbyClick()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-normal text-zinc-700 hover:text-zinc-950 bg-white hover:bg-zinc-100/80 border border-zinc-200/90 hover:border-zinc-300 shadow-2xs transition-all active:scale-[0.98]"
          title="ស្វែងរកសាខាដែលនៅជិតអ្នកបំផុត"
        >
          <i id="nearbyIcon" data-lucide="locate-fixed" class="w-3.5 h-3.5 text-zinc-600 flex-shrink-0"></i>
          <span id="nearbyBtnText">ស្វែងរកសាខាជិតបំផុត</span>
        </button>
        <button
          id="btnResetSort"
          onclick="resetNearbySort()"
          class="hidden inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-light text-zinc-500 hover:text-zinc-800 bg-white hover:bg-zinc-100 border border-zinc-200/80 transition-all shadow-2xs"
          title="ត្រឡប់ទៅការតម្រៀបដើម"
        >
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
          <span>លំនាំដើម</span>
        </button>
      </div>
    </div>

    <!-- Notification / Permission Feedback banner (hidden by default) -->
    <div id="locationNotice" class="hidden mb-3 p-3 rounded-xl text-xs flex items-center justify-between gap-2 border bg-amber-50/80 border-amber-200/70 text-amber-900 transition-all">
      <div class="flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 flex-shrink-0 text-amber-600"></i>
        <span id="noticeText"></span>
      </div>
      <button onclick="dismissLocationNotice()" class="text-amber-500 hover:text-amber-700 p-1 rounded-lg">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <div id="loading" class="text-center py-12 space-y-2">
      <div class="inline-block w-5 h-5 border-[1.5px] border-zinc-900 border-t-transparent rounded-full animate-spin"></div>
      <div class="text-[11px] font-light text-zinc-500">កំពុងទាញទិន្នន័យសាខា...</div>
    </div>

    <div id="branchGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
  </main>

  <!-- Clean Minimal Footer -->
  <footer class="border-t border-zinc-200/70 py-6 text-center text-[11px] font-light text-zinc-400 bg-white">
    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span class="text-zinc-600 font-normal">ស៊ីក្លូកាហ្វេ (CYCLO CAFÉ) • Direct Routing Hub</span>
      <span class="num text-[10px] text-zinc-400">Pure Monochrome & Minimalist Aesthetic</span>
    </div>
  </footer>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
