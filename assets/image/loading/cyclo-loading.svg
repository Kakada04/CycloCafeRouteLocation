<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --dur: 3.2s;
      }
      @keyframes drawCycle {
        0% { stroke-dashoffset: 1000; }
        70% { stroke-dashoffset: 0; }
        90% { opacity: 1; }
        100% { opacity: 0; stroke-dashoffset: 0; }
      }
      @keyframes fadeCycle {
        0%, 55% { opacity: 0; }
        72% { opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes bannerGrow {
        0%, 65% { transform: scaleX(0); }
        74%, 90% { transform: scaleX(1); opacity: 1; }
        100% { opacity: 0; transform: scaleX(1); }
      }
      @keyframes steamRise {
        0%, 70% { opacity: 0; transform: translateY(0); }
        80% { opacity: 0.8; transform: translateY(-8px); }
        92% { opacity: 0; transform: translateY(-20px); }
        100% { opacity: 0; }
      }
      .draw-stroke {
        stroke: #222224;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawCycle var(--dur) cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }
      .fade-el {
        animation: fadeCycle var(--dur) ease-in-out infinite;
      }
      .banner-box {
        transform-origin: 240px 78px;
        animation: bannerGrow var(--dur) cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .steam-1 {
        animation: steamRise var(--dur) ease-out infinite;
      }
      .steam-2 {
        animation: steamRise var(--dur) ease-out infinite 0.2s;
      }
    </style>
  </defs>

